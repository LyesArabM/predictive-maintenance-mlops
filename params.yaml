split:
  seed: 42
  test_size: 0.2
  raw_path: data/raw/ai4i2020.csv
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv

train:
  seed: 42
  n_splits: 5
  n_repeats: 3
  model_path: models/model.joblib
  metrics_path: reports/metrics.json
  experiments:
    - name: logreg_raw
      model: logreg
      derived: false
    - name: logreg_derived
      model: logreg
      derived: true
    - name: xgboost_raw
      model: xgboost
      derived: false
    - name: xgboost_derived
      model: xgboost
      derived: true

xgboost:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8