[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"
requires-python = ">=3.12"

[project]
name = "predictive_maintenance_mlops"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Lyes" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["predictive_maintenance_mlops"]
include = ["pyproject.toml", "predictive_maintenance_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["predictive_maintenance_mlops"]
force-sort-within-sections = true

